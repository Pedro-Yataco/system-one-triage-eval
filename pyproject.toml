[project]
name = "system-one-triage-eval"
version = "0.1.0"
description = "Evaluación de modelos System One (Jev, Laya) frente a un LLM de referencia en triaje de tickets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[project.scripts]
triage-eval = "triage_eval.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "triage_eval"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: necesita laya-serve corriendo en http://127.0.0.1:8000"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
    "types-tqdm>=4.70.0.20260906",
]
